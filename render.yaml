services:
  - type: web
    name: anish-tuition-mern-professional-seo
    env: node
    plan: free
    rootDir: .
    buildCommand: |
      cd backend && npm install && npm run build
    startCommand: |
      cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@example.com
      - key: ADMIN_PASSWORD
        value: strong_password_here
      - key: MONGO_URI
        sync: false
